<form (submit)="atualizaPost($event)">

    <input type="text" inputmode="numeric" [formField]="postForm.id" placeholder="Id do post">
    <input type="text" inputmode="numeric" [formField]="postForm.userId" placeholder="UserId">
    <input type="text" [formField]="postForm.title" placeholder="Title">
    <input type="text" [formField]="postForm.body" placeholder="Body">

    <button>Atualizar Post!</button>

</form>
